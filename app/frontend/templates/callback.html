<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Добро пожаловать, {{ user.first_name }}</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .card {
            background-color: white;
            border-radius: 8px;
            padding: 20px;
            max-width: 400px;
            margin: 40px auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .user-photo {
            border-radius: 50%;
            width: 120px;
            height: 120px;
            object-fit: cover;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Привет, {{ user.first_name }}!</h1>
        <img class="user-photo" src="{{ user.photo_url or 'https://via.placeholder.com/120' }}" alt="Фото пользователя">
        <p><strong>ID:</strong> {{ user.user_id }}</p>
        <p><strong>Username:</strong> @{{ user.username }}</p>
        <p><strong>Имя:</strong> {{ user.first_name }}</p>
        {% if user.last_name %}
            <p><strong>Фамилия:</strong> {{ user.last_name }}</p>
        {% endif %}
        <a class="btn" href="/dashboard">Перейти в приложение</a>
    </div>
</body>
</html>
