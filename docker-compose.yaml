version: '2.4'

services:
  backend:
    build:
      context: .
    env_file: .env
    environment:
      DATABASE_RETRY_DELAY: ${DATABASE_RETRY_DELAY:-5}
      DATABASE_MAX_RETRIES: ${DATABASE_MAX_RETRIES:-10}
      API_BASE_URL: https://mixfom2025.fvds.ru
      WEBHOOK_URL: https://mixfom2025.fvds.ru/api/telegram/webhook
      TMP_DIR: /app/static/tmp
    command: ["gunicorn","-k","uvicorn.workers.UvicornWorker","app.main:app",
              "-b","0.0.0.0:8000","-w","3","--timeout","60","--graceful-timeout","30"]
    volumes:
      - receipts_data:/app/static/receipts
    expose:
      - "8000"
    depends_on:
      - postgres
    restart: always
    networks: [app-network]
    cpus: "0.90"
    mem_limit: "4g"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  postgres:
    image: postgres:15-alpine
    env_file: .env
    environment:
      POSTGRES_HOST_AUTH_METHOD: ${POSTGRES_HOST_AUTH_METHOD:-scram-sha-256}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always
    networks: [app-network]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  nginx:
    image: nginx:1.23-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - receipts_data:/app/static/receipts:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    restart: always
    networks: [ app-network ]

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  receipts_data: