version: '3.9'

services:
  backend:
    build:
      context: .
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
    env_file: .env
    expose:
      - "8000"
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 4G

  postgres:
    image: postgres:15-alpine
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network

  nginx:
    image: nginx:1.23-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./app/frontend/build/web:/var/www/flutter:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    restart: always
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data: