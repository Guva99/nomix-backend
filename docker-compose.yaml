version: '3.9'

services:
  backend:
    build:
      context: .
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}  # Передаем GITHUB_TOKEN через build-args
    env_file: .env  # Подключаем .env файл для переменных окружения
    volumes:
      - ./app:/app
      - ./frontend/build/web:/app/frontend/build/web
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  postgres:
    image: postgres:15-alpine
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  nginx:
    image: nginx:1.23-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./app/frontend/static:/var/www/static:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
