version: '3.9'

services:
  backend:
    build:
      context: .
    env_file: .env
    volumes:
      - receipts_data:/app/static/receipts
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_RETRY_DELAY: ${DATABASE_RETRY_DELAY}
      DATABASE_MAX_RETRIES: ${DATABASE_MAX_RETRIES}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5).read(); sys.exit(0)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: always
    networks:
      - app-network
    # лимиты для non-swarm:
    cpus: "0.90"          # у тебя 1 vCPU, ставим <= 1.00
    mem_limit: "4g"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  postgres:
    image: postgres:15-alpine
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_HOST_AUTH_METHOD: ${POSTGRES_HOST_AUTH_METHOD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-numix} -d ${POSTGRES_DB:-numix}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
    networks:
      - app-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  nginx:
    image: nginx:1.23-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - receipts_data:/app/static/receipts
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    networks:
      - app-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  receipts_data:
