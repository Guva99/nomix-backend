worker_processes  auto;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile            on;
    keepalive_timeout   65;
    client_max_body_size 20m;

    gzip  on;
    gzip_types text/plain text/css text/xml application/json \
               application/javascript application/xml \
               application/xml+rss text/javascript;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # ---------------- backend ----------------
    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    # ---------------- redirect HTTP → HTTPS ----------------
    server {
        listen 80;
        server_name mixfom2025.fvds.ru;
        return 301 https://$host$request_uri;
    }

    # ---------------- main HTTPS server ----------------
    server {
        listen 443 ssl http2;
        server_name mixfom2025.fvds.ru;

        ssl_certificate     /etc/letsencrypt/live/mixfom2025.fvds.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mixfom2025.fvds.ru/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;

        # ---------- Flutter build ----------
        root  /var/www/flutter;
        index index.html;

        # статические ресурсы с fingerprint ⇒ кэш-тайм 1 год
        location ~* \.(?:js|css|png|jpe?g|gif|svg|woff2?|ttf|otf|json)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # index.html — обновляется
        location = /index.html {
            add_header Cache-Control "public, max-age=0, must-revalidate";
        }

        # service-worker — всегда свежий
        location = /flutter_service_worker.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma        "no-cache";
            add_header Expires       "0";
        }

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ---------- общие proxy-заголовки ----------
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # API
        location /api/ {
            proxy_pass http://backend;
        }

        # Telegram WebHook
        location /webhook {
            proxy_pass http://backend/webhook;
        }
    }
}