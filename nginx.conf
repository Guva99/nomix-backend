worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 20M;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Указываем upstream для бэкенда
    upstream backend {
        server backend:8000;  # Прокси на контейнер backend, порт 8000
    }

    # === HTTP сервер (порт 80) — редирект на HTTPS ===
    server {
        listen 80;
        server_name mixfom2025.fvds.ru;

        # Все HTTP-запросы перенаправляем на HTTPS
        return 301 https://$host$request_uri;

        root /var/www/html;

        # Проксирование всех запросов на бэкенд
        location / {
            try_files $uri $uri/ =404;
        }
    }

    # === HTTPS сервер (порт 443) ===
    server {
        listen 443 ssl http2;
        server_name mixfom2025.fvds.ru;

        # Пути к сертификатам Let's Encrypt
        ssl_certificate /etc/letsencrypt/live/mixfom2025.fvds.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mixfom2025.fvds.ru/privkey.pem;

        # Безопасные SSL-настройки
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # === Проксирование запросов на /webhook ===
        location /webhook {
            proxy_pass http://backend;  # Прокси на бэкенд
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 90;
            proxy_send_timeout 90;
            proxy_read_timeout 90;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # === Проксирование всех остальных запросов на бэкенд ===
        location / {
            proxy_pass http://backend:8000;  # Прокси на бэкенд:8000
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;
        }

        # === Обслуживание статических файлов ===
        location /static/ {
            alias /usr/share/nginx/html/static/;
            expires 30d;
            add_header Cache-Control "public";
        }

        # === Обработка ошибок ===
        error_page 404 /404.html;
        location = /404.html {
            root /usr/share/nginx/html;
            internal;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
