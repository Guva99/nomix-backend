worker_processes auto;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # Базовые настройки
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Оптимизация производительности
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    keepalive_requests 10000;
    client_max_body_size 20m;
    reset_timedout_connection on;

    # SSL оптимизации
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_buffer_size 16k;
    ssl_prefer_server_ciphers on;

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;

    # Кэширование файлов
    open_file_cache max=2000 inactive=20s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors off;

    # Логирование
    access_log off;
    error_log /var/log/nginx/error.log warn;

    upstream backend {
        server backend:8000;
        keepalive 64;
    }

    server {
        listen 80;
        server_name mixfom2025.fvds.ru;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name mixfom2025.fvds.ru;

        # Безопасность
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header Permissions-Policy "geolocation=(), microphone=()";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload";

        # SSL сертификаты
        ssl_certificate /etc/letsencrypt/live/mixfom2025.fvds.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mixfom2025.fvds.ru/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

        root /var/www/flutter;
        index index.html;

        # Статические файлы с версионированием
        location ~* \.(?:js|css|png|jpe?g|gif|svg|webp|woff2?|ttf|otf|json)$ {
            if ($args ~* "v=[0-9]+") {
                add_header Cache-Control "public, max-age=31536000, immutable";
                access_log off;
                expires max;
            }
            if ($args !~* "v=[0-9]+") {
                add_header Cache-Control "public, max-age=3600";
            }
            try_files $uri =404;
        }

        # HTML файлы - без кэширования
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            try_files $uri =404;
        }

        # Service Worker
        location = /flutter_service_worker.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            add_header Service-Worker-Allowed "/";
            try_files $uri =404;
        }

        # API
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_cache api_cache;
            proxy_cache_valid 200 302 10m;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;
        }

        # WebHook
        location /webhook {
            proxy_pass http://backend/webhook;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:20m inactive=60m use_temp_path=off;
}