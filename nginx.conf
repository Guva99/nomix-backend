worker_processes  auto;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile            on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout   65;
    keepalive_requests 1000;
    client_max_body_size 20m;

    # Оптимизация SSL
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_buffer_size 4k;

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/xml
               application/xml+rss text/javascript
               application/vnd.ms-fontobject
               application/x-font-ttf
               font/opentype
               image/svg+xml;
    gzip_disable "msie6";

    # Кэширование файлов
    open_file_cache max=200000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # ---------------- backend ----------------
    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    # ---------------- redirect HTTP → HTTPS ----------------
    server {
        listen 80;
        server_name mixfom2025.fvds.ru;
        return 301 https://$host$request_uri;
    }

    # ---------------- main HTTPS server ----------------
    server {
        listen 443 ssl http2;
        server_name mixfom2025.fvds.ru;

        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header Permissions-Policy "geolocation=(), microphone=()";

        ssl_certificate     /etc/letsencrypt/live/mixfom2025.fvds.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mixfom2025.fvds.ru/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-CHACHA20-POLY1305';

        # HTTP/2 server push
        http2_push_preload on;

        # ---------- Flutter build ----------
        root  /var/www/flutter;
        index index.html;

        location = / {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            try_files /index.html =404;
        }

        location ~* \.(?:js|css|png|jpe?g|gif|svg|webp|woff2?|ttf|otf|json)$ {
        # Для URL с версией - долгий кэш
            if ($args ~* "v=[0-9]+") {
                 add_header Cache-Control "public, max-age=31536000, immutable";
                 access_log off;
                 expires max;
            }
        # Без версии - не кэшируем
            if ($args !~* "v=[0-9]+") {
                 add_header Cache-Control "no-cache";
            }
        }

        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }


        # service-worker — всегда свежий
        location = /flutter_service_worker.js {
             add_header Cache-Control "no-cache, no-store, must-revalidate";
             add_header Pragma "no-cache";
             add_header Expires "0";
             add_header Service-Worker-Allowed "/";
             add_header Cross-Origin-Embedder-Policy "require-corp";
             add_header Cross-Origin-Opener-Policy "same-origin";
             try_files $uri =404;
        }

        rewrite ^/tgWebAppData=(.*)$ /index.html?tgWebAppData=$1 last;

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ---------- общие proxy-заголовки ----------
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # API
        location /api/ {
            proxy_pass http://backend;
            proxy_cache api_cache;
            proxy_cache_valid 200 302 10m;
            proxy_cache_valid 404 1m;
        }

        # Telegram WebHook
        location /webhook {
            proxy_pass http://backend/webhook;
        }
    }

    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m inactive=60m use_temp_path=off;
}