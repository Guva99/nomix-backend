worker_processes auto;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- Общие оптимизации
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 30s;
    keepalive_requests 10000;
    client_max_body_size 20m;
    server_tokens off;

    # --- SSL
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:50m;
    ssl_session_tickets off;
    ssl_prefer_server_ciphers on;

    # --- Сжатие
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss;

    # --- Логи (JSON формат удобно разбирать)
    log_format main_json escape=json
      '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"host":"$host"'
      '}';
    access_log /var/log/nginx/access.log main_json;
    error_log  /var/log/nginx/error.log  warn;

    # --- Rate limits (защита от DDoS/bruteforce)
    # Общий лимит для API: 10 req/s на IP, "всплеск" до 20 запросов
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    # Более строгий лимит для вебхука (не должен сыпаться чаще нескольких rps)
    limit_req_zone $binary_remote_addr zone=wh_limit:10m rate=3r/s;

    # Ограничение одновременных коннектов с IP
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # --- Upstream до backend (имя контейнера на одной docker-сети)
    upstream backend {
        server backend:8000;
        keepalive 64;
    }

    # --- Перенаправление на HTTPS
    server {
        listen 80;
        server_name mixfom2025.fvds.ru;
        return 301 https://$host$request_uri;
    }

    # --- Основной сервер (HTTPS)
    server {
        listen 443 ssl http2;
        server_name mixfom2025.fvds.ru;

        ssl_certificate     /etc/letsencrypt/live/mixfom2025.fvds.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mixfom2025.fvds.ru/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Безопасные заголовки
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # ---------------------------------
        # Health (совпадает с FastAPI /api/health)
        # ---------------------------------
        location = /api/health {
            proxy_pass http://backend/api/health;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout    10s;
            proxy_send_timeout    10s;
        }

        # ---------------------------------
        # Общий API
        # ---------------------------------
        location /api/ {
            proxy_pass http://backend/;   # ВАЖНО: слэш в конце!
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization     $http_authorization;

            proxy_connect_timeout 60s;
            proxy_read_timeout    120s;
            proxy_send_timeout    60s;

            proxy_buffering on;
            proxy_request_buffering on;
            proxy_cache off;

            # Rate limit & connection limit
            limit_req zone=api_limit burst=20 nodelay;
            limit_conn conn_limit 20;
        }

        # ---------------------------------
        # Telegram webhook — отдельный локейшен:
        # - выключаем буферизацию
        # - более строгие лимиты
        # - быстрые таймауты
        # ---------------------------------
        location = /api/telegram/webhook {
            proxy_pass http://backend/api/telegram/webhook;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout    30s;
            proxy_send_timeout    10s;

            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;

            # Строже лимиты для вебхука
            limit_req zone=wh_limit burst=5 nodelay;
            limit_conn conn_limit 5;
        }

        # ---------------------------------
        # OpenAPI (FastAPI по умолчанию /openapi.json)
        # ---------------------------------
        location = /openapi.json {
            proxy_pass http://backend/openapi.json;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cache_bypass $http_upgrade;
        }

        # ---------------------------------
        # Статика из контейнера backend
        # ---------------------------------
        location /static/ {
            alias /app/static/;
            autoindex off;
            # кэшируем статику браузером
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        # ---------------------------------
        # Всё остальное — на фронт (Firebase)
        # ---------------------------------
        location / {
            return 301 https://nomix-d6199.web.app$request_uri;
        }
    }

    # (Не используем сейчас, но путь на будущее, если включать proxy_cache)
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:20m inactive=60m use_temp_path=off;
}
