worker_processes  auto;

events { worker_connections  1024; }

http {
    # ---------- базовые настройки ----------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile       on;
    keepalive_timeout  65;
    client_max_body_size  20m;

    # gzip
    gzip  on;
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript application/xml
        application/xml+rss text/javascript;

    # логи
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # ---------- backend ----------
    upstream backend {
        server  backend:8000;
        keepalive 32;
    }

    # ---------- HTTP → HTTPS ----------
    server {
        listen      80;
        server_name mixfom2025.fvds.ru;
        return 301  https://$host$request_uri;
    }

    # =====================  main HTTPS server  ======================
    server {
        listen       443 ssl http2;
        server_name  mixfom2025.fvds.ru;

        # --- TLS ---
        ssl_certificate      /etc/letsencrypt/live/mixfom2025.fvds.ru/fullchain.pem;
        ssl_certificate_key  /etc/letsencrypt/live/mixfom2025.fvds.ru/privkey.pem;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache    shared:SSL:10m;

        # --- корень Flutter-сборки ---
        root   /var/www/flutter;
        index  index.html;

        # 1) fingerprint-files (.js, .css, картинки, шрифты, json-манифесты)
        #    → кэшируем на год (immutable)
        location ~* \.(?:js|css|png|jpe?g|gif|svg|woff2?|ttf|otf|json)$ {
            add_header  Cache-Control "public, max-age=31536000, immutable";
        }

        # 2) index.html – «живой»: браузер каждый раз делает conditional-request,
        #    чтобы поймать новую сборку (или через service-worker)
        location = /index.html {
            add_header  Cache-Control "public, max-age=0, must-revalidate";
        }

        # 3) SPA-fallback — все неизвестные пути отдаём index.html
        location / {
            try_files   $uri $uri/ /index.html;
        }

        # 4) service worker всегда свежий
        location = /flutter_service_worker.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma        "no-cache";
            add_header Expires       "0";
        }

        # ---------- proxy params (общие) ----------
        #   вынесены в переменную, чтобы не повторяться
        set $proxy_common "
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host \$host;
            proxy_set_header X-Real-IP \$remote_addr;
            proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto \$scheme;
        ";

        # REST /api/*
        location /api/ {
            proxy_pass http://backend;
            eval \$proxy_common;
        }

        # Telegram webhook
        location /webhook {
            proxy_pass http://backend/webhook;
            eval \$proxy_common;
        }
    }
}