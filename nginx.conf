worker_processes auto;
worker_cpu_affinity auto;
worker_rlimit_nofile 100000;

events {
    worker_connections 10240;
    multi_accept       on;
    use                epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    client_max_body_size 20m;

    # --- Gzip ---
    gzip               on;
    gzip_comp_level    5;
    gzip_proxied       any;
    gzip_min_length    256;
    gzip_types         text/plain text/css text/xml application/json application/javascript application/xml+rss text/javascript;

    # --- Brotli (если собран модуль) ---
    brotli               on;
    brotli_comp_level    5;
    brotli_types         text/plain text/css application/json application/javascript text/xml application/xml+rss image/svg+xml;

    # отдавать заранее сжатые *.gz
    gzip_static        on;

    # кеш открытых файлов
    open_file_cache        max=10000 inactive=20s;
    open_file_cache_valid  30s;
    open_file_cache_min_uses 2;

    # SSL/TLS
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets on;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # HTTP/2 Push для ключевых ресурсов
    http2_push_preload  on;

    # кеш для API GET
    proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m inactive=1m max_size=100m;

    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    # редирект HTTP → HTTPS
    server {
        listen       80;
        server_name  mixfom2025.fvds.ru;
        return 301   https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name mixfom2025.fvds.ru;

        ssl_certificate     /etc/letsencrypt/live/mixfom2025.fvds.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mixfom2025.fvds.ru/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        root  /var/www/flutter;
        index index.html;

        # fingerprint-ресурсы — кэш 1 год + HTTP/2 Push
        location ~* \.(?:js|css|png|jpe?g|gif|svg|woff2?|ttf|otf|json)$ {
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            http2_push_preload on;
            try_files $uri =404;
        }

        # index.html — всегда проверяем у сервера
        location = /index.html {
            add_header Cache-Control "max-age=0, must-revalidate";
        }

        # service worker — no-cache
        location = /flutter_service_worker.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma        "no-cache";
            add_header Expires       "0";
        }

        # Telegram Desktop rewrite: /tgWebAppData=… → /index.html?tgWebAppData=…
        rewrite ^/tgWebAppData=(.*)$ /index.html?tgWebAppData=$1 last;

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        # API прокси с кешем
        location /api/ {
            proxy_pass                 http://backend;
            proxy_cache                api_cache;
            proxy_cache_valid          200 10s;
            add_header                 X-Cache-Status $upstream_cache_status;
        }

        # Telegram webhook
        location /webhook {
            proxy_pass http://backend/webhook;
        }

        # общие proxy-заголовки
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version                1.1;
        proxy_set_header Connection       "";
    }
}
