worker_processes auto;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Основные оптимизации
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 30s;
    keepalive_requests 10000;
    client_max_body_size 20m;
    server_tokens off;

    # SSL настройки
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:50m;
    ssl_session_tickets off;
    ssl_prefer_server_ciphers on;

    # Сжатие
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss;

    # Логи в JSON формате
    log_format main_json escape=json
      '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"host":"$host"'
      '}';

    access_log /var/log/nginx/access.log main_json;
    error_log  /var/log/nginx/error.log  warn;

    # Upstream до backend
    upstream backend {
        server backend:8000;
        keepalive 64;
    }

    # Перенаправление HTTP на HTTPS
    server {
        listen 80;
        server_name mixfom2025.fvds.ru;
        return 301 https://$host$request_uri;
    }

    # Основной HTTPS сервер
    server {
        listen 443 ssl http2;
        server_name mixfom2025.fvds.ru;

        ssl_certificate     /etc/letsencrypt/live/mixfom2025.fvds.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mixfom2025.fvds.ru/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Безопасные заголовки
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # ОСНОВНОЙ location - проксирует ВСЕ на backend
        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization     $http_authorization;

            proxy_connect_timeout 60s;
            proxy_read_timeout    120s;
            proxy_send_timeout    60s;
            proxy_buffering on;
        }

        # ОТДЕЛЬНЫЙ location для Telegram webhook с особыми настройками
        location /api/telegram/webhook {
            proxy_pass http://backend/api/telegram/webhook;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout    30s;
            proxy_send_timeout    10s;
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # Статика из контейнера backend
        location /static/ {
            alias /app/static/;
            autoindex off;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }
    }
}